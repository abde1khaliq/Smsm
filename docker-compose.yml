services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    networks: [app-net]
    restart: unless-stopped

  backend:
    build: ./server
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on: [ollama]
    expose: ["8000"]
    networks: [app-net]
    restart: unless-stopped

  frontend:
    build: ./interface
    ports: ["3000:3000"]
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    networks: [app-net]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama-data:

networks:
  app-net: