services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    networks: [app-net]
    restart: unless-stopped

  backend:
    build: ./server
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on: [ollama]
    expose: ["8000"]
    networks: [app-net]
    restart: unless-stopped

volumes:
  ollama-data:

networks:
  app-net: